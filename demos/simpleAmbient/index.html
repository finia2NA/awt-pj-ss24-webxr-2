<!-- NOTE: as of right now, the effect is achieved litereally just by HTML + CSS. There is no need for a bundler, you can just 2x click this file. I still set it up in vite for hot-reloading -->

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite App</title>
  <style>
    .video-back {
      position: absolute;
      top: 100px;
      left: 100px;
      width: 800px;
      height: auto;
      z-index: 1;
      filter: blur(80px);
    }

    .video-front {
      position: absolute;
      /* position values are just eyeballed btw */
      top: 112px;
      left: 125px;
      width: 750px;
      height: auto;
      z-index: 2;
    }
  </style>

</head>

<body>
  <div class="video-container">
    <!-- NOTE: these videos play independently of one another. In a real player, would have to sync pause, seek, etc. -->
    <video class="video-back" src="assets/ShortClip.mp4" autoplay loop muted></video>
    <video class="video-front" src="assets/ShortClip.mp4" autoplay loop muted></video>
  </div>
</body>

</html>
